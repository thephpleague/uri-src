name: build

on:
    push: ~
    pull_request: ~

jobs:
    linux_tests:
        name: PHP ${{ matrix.php }} - ${{ matrix.stability }}
        runs-on: ubuntu-22.04

        strategy:
            fail-fast: false
            matrix:
                php: ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6', '8.7']
                stability: [prefer-lowest, prefer-stable]

                exclude:
                    - php: '8.7'
                      stability: prefer-lowest

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: xdebug
                  tools: composer:v2

            - name: Validate composer files
              run: composer validate --strict

            # Cache Composer downloads, not vendor.
            - name: Cache Composer packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.composer/cache/files
                  key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

            # Stable PHP + stable dependencies
            - name: Install dependencies
              if: ${{ matrix.stability == 'prefer-stable' && matrix.php != '8.7' }}
              run: composer install --prefer-dist --no-interaction --no-progress

            # Lowest dependencies
            - name: Install dependencies (prefer-lowest)
              if: ${{ matrix.stability == 'prefer-lowest' }}
              run: composer update --prefer-lowest --prefer-dist --no-interaction --no-progress

            # PHP nightly / development version
            - name: Install dependencies (nightly)
              if: ${{ matrix.php == '8.7' }}
              run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress --ignore-platform-req=php

            # Unit tests
            - name: Run Unit tests with coverage
              if: ${{ matrix.php != '8.5' && matrix.php != '8.6' && matrix.php != '8.7' }}
              run: composer phpunit

            - name: Run Unit tests without uri-polyfill
              if: ${{ matrix.php == '8.5' || matrix.php == '8.6' }}
              run: composer phpunit:no-polyfill

            - name: Run Unit tests without coverage (nightly)
              if: ${{ matrix.php == '8.7' }}
              run: composer phpunit:no-coverage

            # Static analysis
            - name: Run static analysis
              if: ${{ matrix.php == '8.4' && matrix.stability == 'prefer-stable' }}
              run: composer phpstan

            # Coding style
            - name: Run Coding style rules
              if: ${{ matrix.php == '8.4' && matrix.stability == 'prefer-stable' }}
              run: composer phpcs:fix
