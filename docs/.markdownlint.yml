default: true
line-length: false
no-inline-html: false # Ignore for fontawesome usage

single-title:
    front_matter_title: '' # Ignore Jekyll titles as headers
heading-style:
    style: atx

code-fence-style:
    style: backtick

ul-style:
    style: dash

code-block-style:
    style: fenced

no-hard-tabs:
    spaces_per_tab: 4

no-duplicate-header:
    allow_different_nesting: true

heading-increment: true

no-emphasis-as-heading: true

fenced-code-language: true

link-fragments: true

MD024:
    siblings_only: true

MD060:
    style: compact
